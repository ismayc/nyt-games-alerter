name: Monthly refresh

# Rebuilds the analysis and redeploys the site on the first of each month,
# independent of the Mac that sends the daily alerts. Fetches any missing recent
# days from the NYT endpoints, rebuilds report/index.html, commits the changes,
# and deploys report/ to Netlify.
#
# Requires one repository secret: NETLIFY_AUTH_TOKEN (a Netlify personal access
# token). The site id is public and set below.

on:
  schedule:
    - cron: '0 13 1 * *'   # 1st of each month, 13:00 UTC (~06:00 America/Phoenix)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

env:
  NETLIFY_SITE_ID: 9221f80a-d120-4590-9509-fd160749e0b3

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("httr", "jsonlite"), repos = "https://packagemanager.posit.co/cran/latest")'

      - name: Refresh data and rebuild report
        run: Rscript scripts/refresh_and_build.R

      - name: Commit refreshed data and report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv report/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed this month."
          else
            git commit -m "Monthly refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli@26 deploy --prod --dir report --site "$NETLIFY_SITE_ID"
