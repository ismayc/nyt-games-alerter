name: Monthly refresh

# Rebuilds the analysis on the first of each month, independent of the Mac that
# sends the daily alerts. Fetches any missing recent days from the NYT endpoints,
# rebuilds report/index.html, and commits the changes. The push triggers the
# Netlify deploy through Netlify's Git integration (see netlify.toml), so this
# workflow needs no Netlify secret.

on:
  schedule:
    - cron: '0 13 1 * *'   # 1st of each month, 13:00 UTC (~06:00 America/Phoenix)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: System libraries (fallback if a source build is needed)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite"))' \
                  -e 'ok <- c("httr","jsonlite") %in% rownames(installed.packages())' \
                  -e 'if (!all(ok)) stop("missing R packages: ", paste(c("httr","jsonlite")[!ok], collapse=", "))'

      - name: Refresh data and rebuild report
        run: Rscript scripts/refresh_and_build.R

      - name: Commit refreshed data and report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/difficulty.csv report/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed this month."
          else
            git commit -m "Monthly refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

